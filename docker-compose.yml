# Voor TrueNAS SCALE: plak dit onder Apps > Discover Apps > Install via YAML.
# Je eigen nginx reverse proxy wijst naar <ip-van-je-nas>:3000 (poort links
# aanpasbaar als 3000 al in gebruik is). De publieke Supabase-gegevens zitten
# al ingebakken in de image (gebouwd via GitHub Actions), dus hier hoeft
# verder niets ingevuld te worden.
services:
  app:
    image: ghcr.io/noctowl17/excelsior-zaal-4-portaal:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
